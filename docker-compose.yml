services:
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /app
    volumes:
      - ./public_html:/app
    ports:
      - "8000:8000"
    command: php -d display_errors=1 -S 0.0.0.0:8000 -t /app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: roopshree
      DB_USER: roopshree
      DB_PASSWORD: roopshree_local_dev

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: roopshree
      POSTGRES_USER: roopshree
      POSTGRES_PASSWORD: roopshree_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./public_html/sql:/docker-entrypoint-initdb.d

volumes:
  postgres-data:
